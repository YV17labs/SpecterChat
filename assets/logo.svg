      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#4A3FD4"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E6FF"/>
