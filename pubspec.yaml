name: specterchat
description: Specter — Lightweight Cross-Platform MCP Chat Client
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # HTTP
  dio: ^5.7.0
  # Markdown rendering
  flutter_markdown: ^0.7.6
  # Syntax highlighting for code blocks
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  # SQLite (drift)
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28
  # JSON serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # UUID generation
  uuid: ^4.5.1
  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  # Collection utilities
  collection: ^1.19.1
  # URL launcher
  url_launcher: ^6.3.1
  # Window management
  window_manager: ^0.4.3
  # Logging
  logger: ^2.5.0
  # Shared preferences (simple settings)
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  drift_dev: ^2.24.0

flutter:
  uses-material-design: true
  assets: []
