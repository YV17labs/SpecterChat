name: specterchat
description: Specter — Lightweight Cross-Platform MCP Chat Client
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  # HTTP
  dio: ^5.9.2
  # Markdown rendering
  flutter_markdown: ^0.7.7
  # Syntax highlighting for code blocks
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  # SQLite (drift)
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.6.0+eol
  # JSON serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  # UUID generation
  uuid: ^4.5.3
  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  # Collection utilities
  collection: ^1.19.1
  # URL launcher
  url_launcher: ^6.3.2
  # Window management
  window_manager: ^0.5.1
  # Logging
  logging: ^1.3.0
  # Shared preferences (simple settings)
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3
  drift_dev: ^2.31.0
  # Testing
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  assets: []
